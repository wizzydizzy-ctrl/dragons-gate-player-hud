name: Release DragonsGateHUD
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install Lua 5.1 from Ubuntu
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1
      - run: lua5.1 tests/run.lua
      - run: python3 -m unittest tests/test_build.py -v
      - name: Build and verify tag matches runtime version
        run: python3 scripts/build.py --owner "${{ github.repository_owner }}" --repository "${GITHUB_REPOSITORY#*/}" --version "${GITHUB_REF_NAME#v}"
      - name: Attest package and manifest provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            dist/DragonsGateHUD.mpackage
            dist/DGHUDRecovery.mpackage
            dist/manifest.json
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/DragonsGateHUD.mpackage dist/DGHUDRecovery.mpackage dist/manifest.json --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/DragonsGateHUD.mpackage dist/DGHUDRecovery.mpackage dist/manifest.json --generate-notes --verify-tag
          fi
